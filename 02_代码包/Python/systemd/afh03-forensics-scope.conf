# afh03-forensics.service 的"波形 SCPI"配置 drop-in 模板
#
# 用法（板端，需要 root）：
#   sudo mkdir -p /etc/systemd/system/afh03-forensics.service.d
#   sudo cp systemd/afh03-forensics-scope.conf /etc/systemd/system/afh03-forensics.service.d/scope.conf
#   sudo sed -i 's/AFH03_SCOPE_HOST=.*/AFH03_SCOPE_HOST=192.168.1.50/' \
#            /etc/systemd/system/afh03-forensics.service.d/scope.conf
#   sudo systemctl daemon-reload && sudo systemctl restart afh03-forensics.service
#
# 原理：`afh03_forensics.py` 里 `--scope-host/--scope-port/--scope-nominal/--scope-tol-pct/--scope-ch`
#       的默认值都读同名环境变量，所以**只要给服务注入环境变量**即可，
#       **不用改它原本的 ExecStart**（改 ExecStart 容易把原参数打散）。
#
# 注意：板子没有外网，网线只接示波器。先用 tools/eth_scope_setup.sh 配好静态 IP 与网段。
[Service]
Environment=AFH03_SCOPE_HOST=
Environment=AFH03_SCOPE_PORT=5555
Environment=AFH03_SCOPE_NOMINAL=20000000,40000000
Environment=AFH03_SCOPE_TOL_PCT=1.0
Environment=AFH03_SCOPE_CH=1
