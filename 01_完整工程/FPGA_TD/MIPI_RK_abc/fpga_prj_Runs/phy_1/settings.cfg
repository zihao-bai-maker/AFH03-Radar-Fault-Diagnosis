# phy_1/settings.cfg -- 手工创建（TD 的 launch_runs 在批处理会话里不提供 alRun 上下文，
# 且原 run.bat 指向不存在的 exe，所以必须这样直接驱动 DefaultFlow.tcl）
# 运行方式（在 phy_1 目录里）：
#   D:\xuexishengshou\TD\bin\td_commands_prompt.exe D:/xuexishengshou/TD/doc/scripts/DefaultFlow.tcl
# start_step=opt_place(索引3) → DefaultFlow 会 import_db ../syn_1/fpga_prj_gate.db
set ADCList {"../../uisrc/04_pin/fpga_pin.adc"}
set IpADCList { ui_ddr ../../uisrc/03_ip/al_ip/ui_ddr/ui_ddr.adc }
set IpSDCList { ui_ddr ../../uisrc/03_ip/al_ip/ui_ddr/ui_ddr.sdc }
set SDCList {"../../uisrc/04_pin/timing.sdc"}
set area_option -packarea
set device_name ph1_90.db
set end_step bitgen
set package_name PH1A90SEG324
set parent ../syn_1
set prj_name {fpga_prj}
set run_type phy
set speed 2
set start_step opt_place
set top_model_name {system_top}
set phyWildParams { flow bad_qor_check off }

#=============================================================================
# ★ 关掉 ChipWatcher 调试中枢的编译，绕开 place 阶段的
#     KIT-8469 ERROR: failed to compile the ooc module top_debug_hub.
#       index ** is out of range [**:**] for '**' in TD/ip/apm/apm_cwc/apm_debughub.sv(6681)
#   根因：工程里残留 al_ip/VPI_0（Virtual Probe Interface），64 个输入探针全是 Dis、
#         只有 1 个 8bit 输出探针，且 VPI_0 在 RTL 里根本没被例化 → 0 探针的调试中枢
#         生成非法索引。DefaultFlow.tcl:163-165 的 opt_place_fun 会无条件 insert_debugger。
#   官方命令回显（已在 TD 里实测）：disable_prcwc -> "Disable post-route cwc compile"
#   ⚠️ 本行是 2026-10-02 加的，**尚未重跑验证**（等 lead 放行后再跑 place/route）。
#=============================================================================
if {[catch {disable_prcwc} e]} { puts "disable_prcwc failed: $e" } else { puts "disable_prcwc ok" }

#=============================================================================
# ★ 2026-10-02 补：DefaultFlow 期望但原 settings.cfg 里没有的流程变量
#   漏了 arr_filter 会导致 place 之后报
#     `can't read "arr_filter": no such variable`
#   然后流程在 export_db 之前就中断 → route/bitgen 根本不会跑。
#   arr_filter=off 表示不做 place/route 阶段的 qor 过滤中止（我们要拿到 bit）。
#=============================================================================
set arr_filter off
set arr_pwns   0
set arr_cong   0
set arr_rwns   0
set drHoldFix  off